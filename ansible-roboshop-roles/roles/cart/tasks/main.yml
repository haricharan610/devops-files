---
 - name: app setup
   include_role:
     name: common
     tasks_from: app-setup.yml

 - name: nodejs setup
   include_role:
     name: common
     tasks_from: nodejs.yml

 - name: copying cart service
   ansible.builtin.template:
     src: cart.service.j2
     dest: /etc/systemd/system/cart.service

 - name: systemd setup
   include_role:
     name: common
     tasks_from: systemd.yml
