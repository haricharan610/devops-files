- name: Disable default nginx module
  ansible.builtin.command: dnf module disable nginx -y

- name: Enable nginx 1.24
  ansible.builtin.command: dnf module enable nginx:1.24 -y

- name: Install nginx and unzip
  ansible.builtin.dnf:
    name:
      - nginx
      - unzip
    state: present

- name: Download RoboShop frontend
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/frontend-v3.zip
    dest: /tmp/frontend.zip
    mode: "0644"

- name: Create frontend directory
  ansible.builtin.file:
    path: /usr/share/nginx/html
    state: directory
    mode: "0755"

- name: Extract frontend files
  ansible.builtin.unarchive:
    src: /tmp/frontend.zip
    dest: /usr/share/nginx/html
    remote_src: true

- name: Copy and test RoboShop nginx config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    validate: "/usr/sbin/nginx -t -c %s"

- name: Test the installed nginx configuration
  ansible.builtin.command: /usr/sbin/nginx -t
  changed_when: false

- name: Start nginx and report any startup error
  block:
    - name: Enable and restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
        enabled: true

  rescue:
    - name: Read nginx startup log
      ansible.builtin.command: journalctl -u nginx -n 30 --no-pager
      register: nginx_log
      changed_when: false

    - name: Show why nginx failed
      ansible.builtin.fail:
        msg: "{{ nginx_log.stdout_lines }}"