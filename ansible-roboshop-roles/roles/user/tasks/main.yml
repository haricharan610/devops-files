---
 - name: app setup
   include_role:
     name: common
     tasks_from: app-setup.yml

 - name: nodejs setup
   include_role:
     name: common
     tasks_from: nodejs.yml

 - name: copying user service
   ansible.builtin.template:
     src: user.service.j2
     dest: /etc/systemd/system/user.service

 - name: systemd setup
   include_role:
     name: common
     tasks_from: systemd.yml            