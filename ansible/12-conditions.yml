---
- name: conditions DEMP
  hosts: local
  connection: local
  vars:
    NUMBER: 130

  tasks: 
  - name: print if the number is greather than or equal to 100
    ansible.builtin.debug:
      msg: " Given number is {{ NUMBER }} is less than or equal to 100"
    when: NUMBER <= 100


  - name: print if the number is less than 100 or equal to 100
    ansible.builtin.debug:
     msg: "Given number is {{ NUMBER }} is less than to 100"

    when: NUMBER > 100      