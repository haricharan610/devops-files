---
 - name: configuring cart service
   hosts: cart
   become: true
   tasks:
     - name: disabling default nodejs
       ansible.builtin.command: dnf module disable nodejs -y

     - name: enabling nodejs 20
       ansible.builtin.command: dnf module enable nodejs:20 -y

     - name: installing nodejs 20
       ansible.builtin.dnf:
         name: nodejs
         state: present

     - name: creating roboshop system user
       ansible.builtin.user:
         name: roboshop
         shell: /sbin/nologin
         system: true
         home: /app

     - name: creating app directory 
       ansible.builtin.file:
         path: /app
         state: directory

     - name: downloading application into app directory
       ansible.builtin.get_url:
         url: https://roboshop-artifacts.s3.amazonaws.com/cart-v3.zip
         dest: /tmp/cart.zip

     - name: unzipping cart
       ansible.builtin.unarchive:
         src: /tmp/cart.zip
         dest: /app
         remote_src: yes

     - name: installing npm
       ansible.builtin.npm:
         path: /app

     - name: copying cart service
       ansible.builtin.copy:
         src: cart.service
         dest: /etc/systemd/system/cart.service

     - name: daemon reload
       ansible.builtin.systemd_service:
         daemon_reload: true

     - name: start and enable cart service
       ansible.builtin.service:
         name: cart
         state: started
         enabled: yes



           



   
