---
 - name: configuring shipping server
   hosts: shipping
   become: true
   tasks:
     - name: installing maven
       ansible.builtin.dnf:
         name: "{{ item }}"
         state: installed
       loop:
       - maven
       - mysql

     - name: installing pymysql 
       ansible.builtin.pip:
         name: "{{ item }}" 
         executable: pip3.9
       loop:
       - cryptography
       - pymysql
 
     - name: creating roboshop system user
       ansible.builtin.user:
         name: roboshop
         shell: /sbin/nologin
         system: true
         home: /app

     - name: creating app directory
       ansible.builtin.file:
         path: /app
         state: directory

     - name: downloading application into app directory
       ansible.builtin.get_url:
         url: https://roboshop-artifacts.s3.amazonaws.com/shipping-v3.zip 
         dest: /tmp/shipping.zip

     - name: unzipping shipping
       ansible.builtin.unarchive:
         src: /tmp/shipping.zip
         dest: /app
         remote_src: yes

     - name: downloading dependencies 
       ansible.builtin.command: mvn clean package 
       args:
          chdir: /app

     - name: rename jar file
       ansible.builtin.command: mv target/shipping-1.0.jar shipping.jar 
       args: 
          chdir: /app

     - name: copying shipping service
       ansible.builtin.copy:
         src: shipping.service
         dest: /etc/systemd/system/shipping.service

     - name: daemon reload
       ansible.builtin.systemd_service:
         daemon_reload: yes


     - name: start and enabling shipping
       ansible.builtin.service:
         name: shipping
         state: started
         enabled: yes

     - name: import data
       tags:
       - import
       community.mysql.mysql_db:      
         name: all
         login_user: root
         login_password: RoboShop@1
         login_host: mysql.nadalla.store
         state: import
         target: "{{ item }}"
       loop:
         - /app/db/schema.sql
         - /app/db/app-user.sql 
         - /app/db/master-data.sql

     - name: restart shipping
       ansible.builtin.service:
         name: shipping
         state: restarted


                




