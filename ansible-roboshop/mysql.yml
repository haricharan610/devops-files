---
 - name: configuring mysql
   hosts: mysql
   become: true
   tasks:
     - name: installing mysql 
       ansible.builtin.dnf:
         name:  mysql-server
         state: installed

     - name: start and enable mysql
       ansible.builtin.service:
         name: mysqld
         state: started
         enabled: yes

     - name: seeting password
       ansible.builtin.command: mysql_secure_installation --set-root-pass RoboShop@1


